name: Report — обновление и деплой

# Один воркфлоу делает всё: собирает данные, коммитит и деплоит сайт.
# Так сделано намеренно: пуш, выполненный GITHUB_TOKEN, НЕ запускает другие
# воркфлоу, поэтому обычный pages.yml после такого коммита не сработал бы
# и страница осталась бы со старыми цифрами.

on:
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 07:00 МСК, каждый день
  workflow_dispatch:          # и кнопкой вручную

permissions:
  contents: write             # нужен для коммита data.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  report:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить сборщик отчёта
        run: python -m unittest discover -s tests -v

      - name: Собрать data.json
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: python scripts/build_report.py

      - name: Закоммитить, если данные изменились
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/report/data.json; then
            echo "Данные не изменились — коммит не нужен"
          else
            git add public/report/data.json
            git commit -m "chore(report): обновление данных $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
